<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#f8d8a0" />
<title>Shiba Run — One-Tap Dog Runner</title>
<style>
:root{color-scheme:light;--ink:#493321;--cream:#fff8e9;--orange:#ec8d41}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#f7d89f;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}
#hud{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;gap:12px}
.hud-box{background:#fff9eddf;border:2px solid #fff;box-shadow:0 4px 0 #8c5c2b25;border-radius:18px;padding:8px 13px;color:var(--ink);font-weight:900;font-size:20px;line-height:1.2;white-space:nowrap}
.hud-box small{display:block;letter-spacing:.13em;font-size:9px;font-weight:900;color:#a4784a;margin-bottom:2px}.hud-right{display:flex;gap:8px}.bone{color:#d67d30}
#sound{pointer-events:auto;cursor:pointer;touch-action:manipulation;border:2px solid #fff;border-radius:17px;background:#fff9eddf;font-size:21px;width:46px;height:46px;box-shadow:0 4px 0 #8c5c2b25}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;pointer-events:none}
#panel{pointer-events:auto;max-width:390px;width:min(100%,390px);padding:24px 22px 21px;text-align:center;background:#fff9e9f2;border:3px solid #fff;border-radius:30px;box-shadow:0 14px 0 #bf803f40,0 22px 50px #68401b30;color:var(--ink)}
#panel .eyebrow{font-size:12px;font-weight:900;letter-spacing:.2em;color:#c67c37;margin-bottom:8px}#panel h1{font-weight:1000;margin:0;font-size:clamp(38px,9vw,57px);line-height:.96;letter-spacing:-.065em;color:#d97b2b;text-shadow:2px 3px 0 #f5d6a7}#panel p{font-size:15px;line-height:1.45;margin:13px 0 19px;font-weight:600}#panel button{background:#e98938;color:white;border:0;border-bottom:5px solid #be601d;border-radius:17px;width:100%;padding:14px;font-size:19px;font-weight:950;cursor:pointer;touch-action:manipulation}#panel button:active{transform:translateY(3px);border-bottom-width:2px}
#panel .hint{font-size:11px;color:#a47f58;font-weight:800;margin-top:13px}#panel .results{display:flex;justify-content:center;gap:34px;margin:14px 0 20px;font-size:25px;font-weight:950}#panel .results small{display:block;font-size:10px;letter-spacing:.13em;color:#a47f58}#overlay.hidden{display:none}
#tip{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:9px 15px;border-radius:50px;background:#fff9edbf;font-size:12px;font-weight:850;white-space:nowrap;color:#72502d;pointer-events:none;transition:opacity .25s}
@media(max-height:520px){#panel{padding:15px 20px}#panel h1{font-size:37px}#panel p{margin:8px 0}#panel .hint{margin-top:7px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Shiba Run game"></canvas>
<div id="hud"><div class="hud-box"><small>DISTANCE</small><span id="score">0000</span> m</div><div class="hud-right"><div class="hud-box"><small>BEST</small><span id="best">0000</span></div><div class="hud-box"><small>BONES</small><span class="bone">🦴 <span id="bones">0</span></span></div><button id="sound" aria-label="Toggle sound">🔊</button></div></div>
<div id="overlay"><div id="panel"><div class="eyebrow">ONE-TAP ARCADE</div><h1>SHIBA<br>RUN!</h1><p>Good dog. Bad decisions.<br>Jump over obstacles, collect bones, run forever!</p><button id="start">LET'S RUN →</button><div class="hint">TAP ANYWHERE · SPACE · ↑</div></div></div>
<div id="tip">TAP TO JUMP · DOUBLE JUMP!</div>
<script>
(() => {
'use strict';
const c=document.getElementById('game'), ctx=c.getContext('2d');
const $=id=>document.getElementById(id), overlay=$('overlay'), panel=$('panel'), tip=$('tip');
const scoreEl=$('score'),bestEl=$('best'),bonesEl=$('bones');
let W=400,H=750,DPR=1,ground=580,scale=1,last=0,mode='ready',clock=0,meters=0,bones=0,best=0,muted=false,worldX=0,spawnTimer=0,objects=[],particles=[],shake=0;
try{best=Number(localStorage.getItem('shiba-run-best')||0)}catch(e){}bestEl.textContent=String(best).padStart(4,'0');
const dog={x:95,y:0,vy:0,jumps:0,rot:0,anim:'idle',animTime:0,actionTime:0,spinTime:0};
const dogAtlas=new Image();let atlasReady=false;
dogAtlas.onload=()=>{atlasReady=true};dogAtlas.onerror=()=>{atlasReady=false};dogAtlas.src='shiba-atlas.png';
const spriteFrames={idle:0,run_1:1,run_2:2,run_3:3,run_4:4,jump_launch:5,jump_air:6,double_jump:7,landing:8,hurt:9,collect:10,game_over:11};
let gameOverDelay=0;
function anim(name){if(dog.anim!==name){dog.anim=name;dog.animTime=0}}
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.style.width=W+'px';c.style.height=H+'px';scale=Math.max(.75,Math.min(1.34,W/400));ground=Math.round(H*.75);if(H<560)ground=H*.79;dog.x=Math.max(66,W*.22);if(mode!=='playing')dog.y=ground-24*scale;}
window.addEventListener('resize',resize,{passive:true});resize();
let audio;
function beep(freq=500,dur=.08,type='sine',volume=.07){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.75,audio.currentTime+dur);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
$('sound').onclick=e=>{e.stopPropagation();muted=!muted;$('sound').textContent=muted?'🔇':'🔊'};
function reset(){mode='playing';clock=0;meters=0;bones=0;worldX=0;spawnTimer=1.1;objects=[];particles=[];shake=0;dog.y=ground-24*scale;dog.vy=0;dog.jumps=0;dog.rot=0;dog.anim='run_1';dog.animTime=0;dog.actionTime=0;dog.spinTime=0;gameOverDelay=0;scoreEl.textContent='0000';bonesEl.textContent='0';overlay.classList.add('hidden');tip.style.opacity='1'}
function jump(){if(dog.jumps>=2)return;dog.vy=-(dog.jumps===0?595:525)*scale;dog.jumps++;dog.actionTime=0;dog.spinTime=0;anim(dog.jumps===1?'jump_launch':'double_jump');beep(dog.jumps===1?520:720,.11,'triangle',.065);for(let i=0;i<7;i++)particles.push({x:dog.x-20*scale,y:ground-6*scale,vx:rand(-70,30)*scale,vy:rand(-100,-10)*scale,life:.35,color:'#e7c38f',r:rand(2,5)*scale});}
function action(e){if(e&&e.cancelable)e.preventDefault();if(mode==='playing')jump();else if(mode==='ready'||mode==='over')reset()}
c.addEventListener('pointerdown',action);$('start').addEventListener('pointerdown',e=>e.stopPropagation());$('start').addEventListener('click',e=>{e.stopPropagation();reset()});document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){if(e.repeat)return;action(e)}});
function makeObstacle(){const size=rand(25,40)*scale;objects.push({type:pick(['cone','bush','cone','log']),x:W+60*scale,y:ground,w:size*(Math.random()>.7?1.3:1),h:size,hit:false});if(Math.random()<.7){const amount=Math.random()<.25?3:1;for(let i=0;i<amount;i++)objects.push({type:'bone',x:W+(amount===1?20:i*34)*scale+60*scale,y:ground-rand(87,140)*scale,w:20*scale,h:18*scale,hit:false})}}
function puff(x,y,color,n=9){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-170,170)*scale,vy:rand(-240,-60)*scale,life:rand(.3,.65),color,r:rand(3,7)*scale})}
function gameOver(){mode='over';gameOverDelay=.62;anim('hurt');shake=10;beep(170,.26,'sawtooth',.13);if(Math.floor(meters)>best){best=Math.floor(meters);try{localStorage.setItem('shiba-run-best',best)}catch(e){}}bestEl.textContent=String(best).padStart(4,'0');panel.innerHTML=`<div class="eyebrow">THE ADVENTURE ENDS</div><h1>OOPS! 🐕</h1><p>Our brave shiba has met an obstacle.</p><div class="results"><div><small>DISTANCE</small>${Math.floor(meters)} m</div><div><small>BONES</small>${bones} 🦴</div></div><button id="start">TRY AGAIN →</button><div class="hint">TAP TO TRY AGAIN</div>`;$('start').addEventListener('click',e=>{e.stopPropagation();reset()})}
function update(dt){clock+=dt;dog.animTime+=dt;dog.actionTime+=dt;
if(mode!=='playing'){
if(mode==='ready'){anim('idle');dog.y=ground-24*scale+Math.sin(clock*3)*2;}
if(mode==='over'){if(dog.animTime>.30)anim('game_over');gameOverDelay-=dt;if(gameOverDelay<=0)overlay.classList.remove('hidden')}
return}
const speed=(250+Math.min(220,meters*.20))*scale;worldX+=speed*dt;meters+=speed*dt/27;scoreEl.textContent=String(Math.floor(meters)).padStart(4,'0');if(meters>25)tip.style.opacity='0';spawnTimer-=dt;if(spawnTimer<=0){makeObstacle();spawnTimer=rand(1.05,1.65)*250*scale/speed;}
 dog.vy+=1530*scale*dt;dog.y+=dog.vy*dt;if(dog.y>=ground-24*scale){if(dog.jumps>0&&dog.vy>0)puff(dog.x,ground-3*scale,'#edd1a4',4);const justLanded=dog.jumps>0;dog.y=ground-24*scale;dog.vy=0;dog.jumps=0;if(justLanded){anim('landing');dog.actionTime=0}}dog.rot=dog.vy<-50?-.04:dog.vy>50?.06:0;
if(dog.jumps===0){if(dog.anim==='landing'&&dog.actionTime<.14){}else if(dog.anim==='collect'&&dog.actionTime<.28){}else anim('run_1')}
else if(dog.jumps===2){anim('double_jump');dog.spinTime+=dt}
else if(dog.actionTime<.11)anim('jump_launch');else anim('jump_air');
 for(let i=objects.length-1;i>=0;i--){const o=objects[i];o.x-=speed*dt;if(o.x<-100){objects.splice(i,1);continue}if(o.hit)continue;const dx=Math.abs(o.x-dog.x),feet=dog.y+24*scale,bodyTop=dog.y-20*scale;if(o.type==='bone'){if(dx<27*scale&&Math.abs(dog.y-o.y)<34*scale){o.hit=true;if(dog.jumps===0){anim('collect');dog.actionTime=0}bones++;bonesEl.textContent=bones;beep(850,.12,'sine',.065);puff(o.x,o.y,'#ffca57',8);objects.splice(i,1)}}else{if(dx<((o.w*.47)+(13*scale))&&feet>ground-o.h+8*scale&&bodyTop<ground-5*scale){puff(dog.x+12*scale,dog.y,'#fff2d7',14);gameOver();break}}}
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=450*scale*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}shake=Math.max(0,shake-dt*24)}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fill()}
function background(){const sky=ctx.createLinearGradient(0,0,0,ground);sky.addColorStop(0,'#f8d49b');sky.addColorStop(.68,'#fbe6bb');sky.addColorStop(1,'#fff0cc');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ellipse(W*.79,ground*.23,49*scale,49*scale,'#ffe4a0');for(let layer=0;layer<2;layer++){const par=worldX*(layer===0?.12:.24),y=ground-(layer===0?110:62)*scale,step=160*scale;for(let i=-2;i<W/step+3;i++){const x=i*step-(par%step),col=layer===0?'#dfbf8a':'#c8cb96';ellipse(x,y+36*scale,110*scale,58*scale,col)}}
ctx.fillStyle='#a7be75';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#799962';ctx.fillRect(0,ground, W,6*scale);ctx.fillStyle='#d8b882';ctx.fillRect(0,ground+17*scale,W,9*scale);for(let i=0;i<W/(40*scale)+2;i++){const x=i*40*scale-(worldX*.85%(40*scale));rounded(x,ground+52*scale,21*scale,4*scale,2*scale,'#92a96e');rounded(x+15*scale,ground+86*scale,12*scale,3*scale,2*scale,'#92a96e')}
for(let i=0;i<W/(150*scale)+3;i++){const x=i*150*scale-(worldX*.42%(150*scale));tree(x,ground-48*scale,i%3)}}
function tree(x,y,kind){ctx.save();ctx.translate(x,y);rounded(-3*scale,0,6*scale,48*scale,3*scale,'#9a8154');ellipse(0,-5*scale,kind===0?31*scale:24*scale,35*scale,'#96ad77');ellipse(-13*scale,2*scale,22*scale,23*scale,'#a7bf83');ellipse(15*scale,0,21*scale,27*scale,'#a4bb80');ctx.restore()}
function shiba(x,y,t){ctx.save();ctx.translate(x,y);ctx.rotate(dog.rot);ctx.scale(scale,scale);const run=dog.jumps===0?Math.sin(t*17):.2,leg=run*5;
// curled tail
ctx.strokeStyle='#b75c27';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-25,-5);ctx.bezierCurveTo(-42,-18,-42,-33,-29,-30);ctx.bezierCurveTo(-17,-27,-23,-16,-30,-19);ctx.stroke();
// back legs
rounded(-22,9+leg,11,15,5,'#b9622c');rounded(7,8-leg,11,16,5,'#b9622c');ellipse(-15,23+leg,8,4,'#fff0d6');ellipse(14,23-leg,8,4,'#fff0d6');
// body
ellipse(-4,0,29,21,'#d77b36');ellipse(10,8,18,12,'#fff3d8');
// pointy ears
poly([[6,-29],[15,-50],[25,-25]],'#b75a26');poly([[11,-32],[16,-43],[21,-29]],'#f9c6a5');poly([[26,-26],[37,-46],[45,-14]],'#b75a26');poly([[31,-28],[37,-39],[40,-19]],'#f9c6a5');
// head
ellipse(27,-12,24,23,'#dc843c');ellipse(32,-1,17,12,'#fff0d7');ellipse(43,-1,10,7,'#fff0d7');ellipse(46,-6,4,3,'#42342d');ellipse(22,-16,3,3.7,'#352c2a');ellipse(39,-17,3,3.7,'#352c2a');ellipse(30,-8,2.8,2,'#e8a07f');
// happy mouth
ctx.strokeStyle='#643d31';ctx.lineWidth=1.7;ctx.beginPath();ctx.moveTo(44,-1);ctx.quadraticCurveTo(42,4,38,3);ctx.stroke();
// bandana
poly([[10,4],[20,7],[12,18]],'#e54d44');ctx.restore()}
function drawDog(x,y,t){
if(!atlasReady){shiba(x,y,t);return}
let frame=dog.anim;
if(frame==='run_1'){const idx=Math.floor(worldX/(33*scale))%4;frame=['run_1','run_2','run_3','run_4'][idx]}
if(frame==='hurt'&&dog.animTime>.27)frame='game_over';
const index=spriteFrames[frame]??0,fw=320,fh=320;
const sx=(index%4)*fw,sy=Math.floor(index/4)*fh;
const size=137*scale;
const py=y+24*scale-(258/320)*size;
ctx.save();ctx.translate(x,py+(258/320)*size);
if(dog.jumps===2){ctx.rotate(Math.min(1,dog.spinTime/.46)*Math.PI*2)}
else ctx.rotate(dog.rot);
ctx.drawImage(dogAtlas,sx,sy,fw,fh,-size/2,-(258/320)*size,size,size);
ctx.restore();
}
function obstacle(o){const x=o.x,y=o.y,w=o.w,h=o.h;if(o.type==='cone'){poly([[x-w*.5,y],[x,y-h],[x+w*.5,y]],'#ed8251');poly([[x,y-h],[x+w*.5,y],[x+w*.17,y]],'#f5a26b');rounded(x-w*.6,y-8*scale,w*1.2,8*scale,3*scale,'#c8683a');rounded(x-w*.29,y-h*.42,w*.58,h*.13,2,'#fff7dc')}else if(o.type==='bush'){ellipse(x,y-h*.39,w*.59,h*.42,'#558e5f');ellipse(x-w*.24,y-h*.36,w*.43,h*.38,'#71a66b');ellipse(x+w*.23,y-h*.48,w*.41,h*.37,'#82b57a');ellipse(x,y-h*.64,w*.35,h*.33,'#7dae70')}else{rounded(x-w*.57,y-h*.46,w*1.13,h*.45,9*scale,'#956640');ellipse(x-w*.53,y-h*.23,h*.19,h*.225,'#bb8450');ellipse(x-w*.53,y-h*.23,h*.09,h*.1,'#78502d')}}
function boneShape(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(Math.sin(clock*7+o.x*.01)*.16);ctx.scale(scale,scale);rounded(-13,-4,26,8,4,'#fff8e8');for(const x of [-12,12])for(const y of [-5,5])ellipse(x,y,5.5,5.5,'#fff8e8');ctx.restore()}
function draw(){ctx.save();if(shake)ctx.translate(rand(-shake,shake),rand(-shake,shake));background();const shadowSize=dog.jumps?Math.max(.4,1-(ground-dog.y)/200):1;ellipse(dog.x,ground+2*scale,26*scale*shadowSize,5*scale*shadowSize,'#708a5c66');objects.filter(o=>o.type==='bone').forEach(boneShape);objects.filter(o=>o.type!=='bone').forEach(obstacle);drawDog(dog.x,dog.y,clock);for(const p of particles){ctx.globalAlpha=Math.min(1,Math.max(0,p.life*2));ellipse(p.x,p.y,p.r,p.r,p.color)}ctx.globalAlpha=1;ctx.restore()}
function loop(now){const dt=Math.min(.032,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
